<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Map - NSBM</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      #map {
        height: 500px;
        width: 500px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">NSBM Green University Map</h2>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      // Coordinates
      const nsbmCenter = [6.8213, 80.0419]; // NSBM Green University
      const foeLocation = [6.8206, 80.0427]; // Faculty of Engineering (FOE)

      // Initialize map
      const map = L.map("map").setView(nsbmCenter, 17);

      // Add OpenStreetMap tiles
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      // Add marker for FOE
      const foeMarker = L.marker(foeLocation).addTo(map);

      // Popup with buggy cart
      foeMarker.bindPopup(`
  <div style="text-align:center">
    <b>FOE</b><br>
    Buggy Cart Available Here<br><br>

    <img 
      src="NSBM Buggy.jpg" 
      alt="Buggy Cart" 
      style="width:100%; border-radius:5px;"
    >
  </div>
`);
    </script>
  </body>
</html>
