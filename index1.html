<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Revision</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin-bottom: 20px;
      }

      #image-container {
        width: 500px;
        height: 500px;
        margin: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #image-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      select {
        padding: 10px;
        width: 500px;
        font-size: 16px;
      }
      #map {
        height: 70vw;
        width: 70vw;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>Hello 28354</h1>

    <div id="image-container">
      <img id="character-image" src="" alt="" />
    </div>

    <select id="characters">
      <option value="">Select a character</option>
      <option value="Garfield">Garfield</option>
      <option value="Odie">Odie</option>
      <option value="Nermel">Nermel</option>
      <option value="John">John</option>
    </select>

    <script>
      const select = document.getElementById("characters");
      const img = document.getElementById("character-image");

      function updateImage(selected) {
        if (!selected) return;
        const confirmChange = confirm(
          `Do you want to change image to ${selected}?`,
        );
        if (confirmChange) {
          img.src = `${selected}.png`;
          img.alt = selected;
          img.style.display = "block";
        }
      }

      // Trigger when selection changes
      select.addEventListener("change", function () {
        updateImage(this.value);
      });

      // Check on page load
      window.addEventListener("load", function () {
        if (select.value) {
          updateImage(select.value);
        }
      });
    </script>
    <h2 style="text-align: center">NSBM Green University Map</h2>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      // Coordinates
      const nsbmCenter = [6.821388470357869, 80.0415687458931]; // NSBM Green University
      const foeLocation = [6.821065323840434, 80.03899293360088]; // Faculty of Engineering (FOE)

      // Initialize map
      const map = L.map("map").setView(nsbmCenter, 17);

      // Add OpenStreetMap tiles
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      // Add marker for FOE
      const foeMarker = L.marker(foeLocation).addTo(map);

      // Popup with buggy cart
      foeMarker.bindPopup(`
  <div style="text-align:center">
    <b>FOE</b><br>
    Buggy Cart Available Here<br><br>

    <img 
      src="NSBM Buggy.jpg" 
      alt="Buggy Cart" 
      style="width:100%; border-radius:5px;"
    >
  </div>
`);
    </script>
  </body>
</html>
