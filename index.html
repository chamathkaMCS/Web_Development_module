<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decrypt Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #B5E18B, #FFFBB1);
      padding: 15px;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 360px; /* mobile-friendly */
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      animation: fadeIn 0.5s ease;
      position: relative;
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
      color: #333;
      font-size: 20px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    textarea, input {
      width: 100%;
      margin-top: 6px;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f9f9f9;
      font-size: 14px;
    }

    textarea {
      resize: none;
    }

    /* CENTERED BUTTONS */
    .btn-row {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 25px; /* pill style */
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }

    .copy-btn {
      background: #4CAF50;
      color: white;
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .decrypt-btn {
      display: block;
      margin: 10px auto 0;
      background: #667eea;
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
    }

    .decrypt-btn:active {
      transform: scale(0.96);
    }

    /* Toast */
    .toast {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: 0.3s;
    }

    .toast.show {
      bottom: -10px;
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🔐 Decrypt</h2>

  <label>Encrypted Message</label>
  <textarea id="encryptedMsg" rows="4" readonly>
ItZXpTr+wiXfnZPvQg9CHvC/0AkMaP7FqpEDHf653ammvGnREMsy9w6+65xHRG6qpg+YhKUVCEfBc9rTV4j67FGCtZrPbRMRvm2E6WMTi9/BhU9REdig2K6eUsrjy8yexcrTMoSRdOPSfdgAWnN6jg==
  </textarea>

  <div class="btn-row">
    <button class="copy-btn" onclick="copyText('encryptedMsg')">Copy</button>
  </div>

  <label>Security Key</label>
  <input type="text" id="securityKey" value="MCS_WTA_A04" readonly>

  <div class="btn-row">
    <button class="copy-btn" onclick="copyText('securityKey')">Copy</button>
  </div>

  <button class="decrypt-btn" onclick="goToDecrypt()">Open Decrypt Tool</button>

  <div id="toast" class="toast">Copied!</div>
</div>

<script>
  function copyText(id) {
    const element = document.getElementById(id);
    const text = element.value || element.textContent;

    navigator.clipboard.writeText(text);
    showToast();
  }

  function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 1200);
  }

  function goToDecrypt() {
    window.open("https://www.devglan.com/online-tools/text-encryption-decryption", "_blank");
  }
</script>

</body>
</html>
